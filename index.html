<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TouReina</title>

</head>
<body>

<header class="hero">
    <h1 class="logo">Tou<span>Reina</span></h1>
    <p class="tagline">Explore the Beauty of Quezon</p>

    <div class="top-buttons">
        <button onclick="openPage('about.html')">About</button>
        <button onclick="openPage('significance.html')">Significance</button>
        <button onclick="openPage('settings.html')">Settings</button>
        <button onclick="openPage('credits.html')">Credits</button>
    </div>
</header>

<section class="municipalities">

    <div class="municipality fade">
        <img src="images/real.jpg" alt="Real, Quezon">
        <div class="info">
            <h2>Real</h2>
            <p>A coastal municipality known for waterfalls, rivers, and serene nature escapes.</p>
            <button onclick="openPage('real.html')">Explore</button>
        </div>
    </div>

    <div class="municipality reverse fade">
        <img src="images/infanta.jpg" alt="Infanta, Quezon">
        <div class="info">
            <h2>Infanta</h2>
            <p>Home to breathtaking waterfalls, bridges, and eco-adventure destinations.</p>
            <button disabled>Coming Soon</button>
        </div>
    </div>

    <div class="municipality fade">
        <img src="images/general_nakar.jpg" alt="General Nakar">
        <div class="info">
            <h2>General Nakar</h2>
            <p>A gateway to Sierra Madre mountains and untouched natural beauty.</p>
            <button disabled>Coming Soon</button>
        </div>
    </div>

</section>
