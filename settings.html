<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings | Reina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <style>
        /* ===== GENERAL PAGE STYLING ===== */
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fa;
            color: #222;
            transition: background 0.3s, color 0.3s, font-size 0.3s;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            padding: 8px 18px;
            border-radius: 18px;
            border: none;
            background: #1e3a8a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background: #3b82f6;
        }

        /* ===== PAGE CONTENT ===== */
        .content {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .content h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 40px;
            color: #0f172a;
        }

        /* ===== SETTINGS GROUP ===== */
        .settings-group {
            display: grid;
            gap: 20px;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 18px 25px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .setting:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.12);
        }

        .setting span {
            font-weight: 500;
            font-size: 16px;
            color: #111827;
        }

        .setting select {
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            cursor: pointer;
            transition: border 0.2s, background 0.2s;
        }

        .setting select:hover {
            border-color: #1e3a8a;
            background: #f0f9ff;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            background: #111;
            color: #ccc;
            border-radius: 12px 12px 0 0;
        }

        /* DARK MODE */
        .dark-mode {
            background: #111827 !important;
            color: #ecfeff !important;
        }

        .dark-mode .top-bar {
            background: #1f2937;
        }

        .dark-mode .nav-btn {
            background: #2563eb;
            color: white;
        }

        .dark-mode .nav-btn:hover {
            background: #3b82f6;
        }

        .dark-mode .setting {
            background: #1f2937;
            color: #f0f9ff;
        }

        .dark-mode .setting select {
            background: #374151;
            color: #f0f9ff;
            border: 1px solid #4b5563;
        }

        /* RESPONSIVE */
        @media(max-width: 500px) {
            .setting {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .setting select {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<header class="top-bar">
    <div class="logo">Reina-L</div>
    <nav>
        <a href="index.html" class="nav-btn back-btn">← Back to Home</a>
    </nav>
</header>

<!-- PAGE CONTENT -->
<section class="content">
    <h2>Settings</h2>

    <div class="settings-group">

        <div class="setting">
            <span>Theme Mode</span>
            <select id="themeSetting">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </div>

        <div class="setting">
            <span>Background Animation</span>
            <select id="bgAnimSetting">
                <option value="on">On</option>
                <option value="off">Off</option>
            </select>
        </div>

        <div class="setting">
            <span>Sound Effects</span>
            <select id="soundSetting">
                <option value="on">On</option>
                <option value="off">Off</option>
            </select>
        </div>

        <div class="setting">
            <span>Text Size</span>
            <select id="textSizeSetting">
                <option value="normal">Normal</option>
                <option value="large">Large</option>
            </select>
        </div>

        <div class="setting">
            <span>Language / Tone</span>
            <select id="langSetting">
                <option value="en">English</option>
                <option value="tl">Taglish</option>
            </select>
        </div>

        <div class="setting">
            <span>Reduced Motion</span>
            <select id="motionSetting">
                <option value="off">Off</option>
                <option value="on">On</option>
            </select>
        </div>

    </div>
</section>

<footer>
    <p>Reina Tourist Website | Group 3 – STEM A</p>
</footer>

<script src="applySettings.js"></script>
<script src="settings.js"></script>

</body>
</html>
