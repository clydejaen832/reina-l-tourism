<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real | Tourist Spots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
    <div class="logo">Reina-L</div>
    <nav>
        <a href="index.html" class="nav-btn back-btn">← Back</a>
    </nav>
</header>

<section class="municipality-header">
    <h1>Real, Quezon</h1>
    <p>Discover nature, rivers, and hidden waterfalls</p>
</section>

<section class="spots">

    <!-- 1 -->
    <div class="spot fade-section">
        <div class="spot-img">
            <img src="images/nonok-falls.jpg" alt="Nonok Falls">
        </div>
        <div class="spot-info">
            <h2>Nonok Falls</h2>
            <p>A peaceful waterfall surrounded by lush forest.</p>
            <button class="explore-btn">Explore</button>
        </div>
    </div>

    <!-- 2 (reversed) -->
    <div class="spot reverse fade-section">
        <div class="spot-img">
            <img src="images/balagbag-falls.jpg" alt="Balagbag Falls">
        </div>
        <div class="spot-info">
            <h2>Balagbag Falls</h2>
            <p>A hidden gem with refreshing waters and calm scenery.</p>
            <button class="explore-btn">Explore</button>
        </div>
    </div>

    <!-- 3 -->
    <div class="spot fade-section">
        <div class="spot-img">
            <img src="images/casa-luna.jpg" alt="Casa Luna River Garden">
        </div>
        <div class="spot-info">
            <h2>Casa Luna River Garden</h2>
            <p>A scenic riverside destination perfect for relaxation.</p>
            <button class="explore-btn">Explore</button>
        </div>
    </div>

</section>

<script src="scrollFade.js"></script>
</body>
</html>
