<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reina Tourist Website - Credits</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }

        body { 
            margin: 0; 
            color: #222;
            transition: background 0.3s, color 0.3s, font-family 0.3s; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .reduced-motion * { 
            animation: none !important; 
            transition: none !important; 
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; 
            background: rgba(255,255,255,0.9); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 0 0 20px 20px;
        }
        .logo { font-size: 26px; font-weight: bold; }
        nav { display: flex; gap: 12px; }
        .nav-btn { padding: 8px 18px; border-radius: 18px; background: #1e3a8a; color: white; font-weight: bold; text-decoration: none; }
        .nav-btn:hover { background: #3b82f6; }

        .credits-container { padding: 60px 20px; max-width: 1200px; margin: auto; }
        .section-title { text-align: center; font-size: 32px; margin-bottom: 50px; }

        .members-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
        }

        .member-card {
            background: #0f172a; color: white; border-radius: 18px; overflow: hidden;
            text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,0.15); cursor: pointer;
            transition: transform 0.2s, opacity 0.8s, transform 0.8s;
            opacity: 0; 
            transform: translateY(40px);
        }
        .member-card.show { opacity: 1; transform: translateY(0); }
        .member-card:hover { transform: translateY(-4px); }

        .member-photo { width: 100%; height: 180px; object-fit: cover; background: #d1d5db; }
        .member-name { margin: 15px 0 20px; font-weight: bold; }

        /* POPUP */
        #popup {
            position: fixed; inset:0; background: rgba(0,0,0,0.6);
            display: none; align-items: center; justify-content: center; z-index: 9999;
            padding: 20px;
        }
        #popup-content {
            background: white; padding: 30px 40px; border-radius: 16px;
            width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
        }
        #popup-role { white-space: pre-line; margin-top: 10px; text-align: left; }
        button {
            margin-top: 20px; padding: 10px 18px; border-radius: 14px;
            border: none; background: #1e3a8a; color: white;
            font-weight: bold; cursor: pointer; width: 100%;
        }

        /* DARK MODE SUPPORT */
        .dark-mode { color: #e5e7eb; }
        .dark-mode .top-bar { background: rgba(31, 41, 55, 0.9); }
        .dark-mode .member-card { background: #1f2937; }
        .dark-mode #popup-content { background: #1f2937; color: #e5e7eb; }
        .dark-mode button { background: #3b82f6; color: white; }
    </style>
</head>
<body class="reduced-motion">

<header class="top-bar">
    <div class="logo">Reina</div>
    <nav>
        <a href="settings.html" class="nav-btn">Settings</a>
        <a href="index.html" class="nav-btn">Home</a>
        <a href="about.html" class="nav-btn">About</a>
    </nav>
</header>

<section class="credits-container">
    <h2 class="section-title">Project Credits</h2>

    <div class="members-grid">
        <!-- MEMBERS TEMPLATE (same as your existing cards) -->
        <div class="member-card" data-profile="Leader Contribution: Web Developer..." onclick="showPopup(this)">
            <img src="Clyde.jpg" class="member-photo">
            <div class="member-name">Clyde Joshua P. Jaen</div>
        </div>
        <!-- repeat all other member cards exactly as before -->
    </div>
</section>

<div id="popup" onclick="closePopup()">
    <div id="popup-content" onclick="event.stopPropagation()">
        <h3 id="popup-name"></h3>
        <p id="popup-role"></p>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<script src="applySettings.js"></script>
<script>
    applySettings(); // apply theme, background, font, motion, etc.

    // POPUP
    function showPopup(card) {
        document.getElementById("popup-name").textContent = card.querySelector(".member-name").textContent;
        document.getElementById("popup-role").textContent = card.dataset.profile;
        document.getElementById("popup").style.display = "flex";
    }
    function closePopup() { document.getElementById("popup").style.display = "none"; }

    // SCROLL ANIMATION FOR MEMBER CARDS
    const cards = document.querySelectorAll('.member-card');
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if(entry.isIntersecting) entry.target.classList.add('show');
        });
    }, { threshold: 0.2 });
    cards.forEach(card => observer.observe(card));
</script>

</body>
</html>
