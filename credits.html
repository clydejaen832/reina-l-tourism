<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
        body { margin: 0; background: #f5f7fa; color: #222; animation: none !important; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .logo { font-size: 26px; font-weight: bold; }
        nav { display: flex; gap: 12px; }
        .nav-btn {
            padding: 8px 18px; border-radius: 18px; background: #1e3a8a;
            color: white; font-weight: bold; text-decoration: none;
        }
        .nav-btn:hover { background: #3b82f6; }

        .credits-container { padding: 60px 20px; max-width: 1200px; margin: auto; }
        .section-title { text-align: center; font-size: 32px; margin-bottom: 50px; }

        .members-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
        }

        .member-card {
            background: #0f172a; color: white; border-radius: 18px; overflow: hidden;
            text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,0.15); cursor: pointer;
            transition: transform 0.2s;
        }
        .member-card:hover { transform: translateY(-4px); }

        .member-photo { width: 100%; height: 180px; object-fit: cover; background: #d1d5db; }
        .member-name { margin: 15px 0 20px; font-weight: bold; }

        /* POPUP */
        #popup {
            position: fixed; inset:0; background: rgba(0,0,0,0.6);
            display: none; align-items: center; justify-content: center; z-index: 9999;
            padding: 20px;
        }
        #popup-content {
            background: white; padding: 30px 40px; border-radius: 16px;
            width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
        }
        #popup-role { white-space: pre-line; margin-top: 10px; text-align: left; }
        button {
            margin-top: 20px; padding: 10px 18px; border-radius: 14px;
            border: none; background: #1e3a8a; color: white;
            font-weight: bold; cursor: pointer; width: 100%;
        }
    </style>
</head>

<script>
function showPopup(card) {
    document.getElementById("popup-name").textContent =
        card.querySelector(".member-name").textContent;
    document.getElementById("popup-role").textContent =
        card.dataset.profile;
    document.getElementById("popup").style.display = "flex";
}
function closePopup() { document.getElementById("popup").style.display = "none"; }
</script>
